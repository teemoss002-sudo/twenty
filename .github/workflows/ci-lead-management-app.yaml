name: CI Lead Management App (live)

# Live end-to-end verification for the JobFlow lead-management app:
# spawns a real Twenty server (all-in-one twenty-app-dev image: server,
# worker, Postgres, Redis), syncs the app into it, and runs the
# integration suite — including the accepted-estimate -> Job automation
# against real database-event delivery. No secrets required: the test
# instance is ephemeral and uses the seeded dev admin token.

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'packages/twenty-apps/public/lead-management/**'
      - '.github/workflows/ci-lead-management-app.yaml'
      - '.github/actions/spawn-twenty-app-dev-test/**'
  pull_request:
    paths:
      - 'packages/twenty-apps/public/lead-management/**'
      - '.github/workflows/ci-lead-management-app.yaml'
      - '.github/actions/spawn-twenty-app-dev-test/**'
  workflow_dispatch:

permissions:
  contents: write # failure diagnostics are pushed to the ci-diagnostics branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      APP_DIR: packages/twenty-apps/public/lead-management
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Spawn Twenty test instance
        id: twenty
        uses: ./.github/actions/spawn-twenty-app-dev-test
        with:
          twenty-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install app dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          corepack enable
          yarn install --immutable

      - name: Unit tests
        working-directory: ${{ env.APP_DIR }}
        run: yarn test


      - name: Integration tests (live server)
        id: integration
        working-directory: ${{ env.APP_DIR }}
        env:
          TWENTY_API_URL: ${{ steps.twenty.outputs.server-url }}
          TWENTY_API_KEY: ${{ steps.twenty.outputs.api-key }}
        run: |
          set -o pipefail
          yarn test:integration 2>&1 | tee /tmp/integration.log

      # Raw job logs are not reachable from every environment; on failure,
      # push the diagnostics to a disposable branch so they stay readable
      # anywhere (repo Issues are disabled, artifacts/logs need blob access).
      - name: Publish failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Live CI failure diagnostics - run ${{ github.run_id }}"
            echo
            echo '## Integration test log (tail)'
            echo '```'
            tail -c 20000 /tmp/integration.log 2>/dev/null
            echo '```'
            echo '## Twenty server log (tail)'
            echo '```'
            docker logs twenty-app-dev-test 2>&1 | tail -c 20000
            echo '```'
          } > /tmp/diagnostics.md
          mkdir -p /tmp/diag-repo && cd /tmp/diag-repo
          git init -q
          git config user.email "ci@github-actions"
          git config user.name "github-actions"
          cp /tmp/diagnostics.md "run-${{ github.run_id }}.md"
          git add . && git commit -qm "Live CI diagnostics ${{ github.run_id }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:ci-diagnostics

  # Real marketplace screenshots, on demand only (Actions tab -> Run
  # workflow): boots the same live instance, syncs the app, seeds demo
  # data, photographs the real UI with Playwright, and commits the PNGs
  # back over the mockups in public/.
  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      APP_DIR: packages/twenty-apps/public/lead-management
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Spawn Twenty test instance
        id: twenty
        uses: ./.github/actions/spawn-twenty-app-dev-test
        with:
          twenty-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install app dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          corepack enable
          yarn install --immutable

      - name: Install Chromium for Playwright
        working-directory: ${{ env.APP_DIR }}
        run: yarn playwright install --with-deps chromium

      - name: Capture screenshots (live server)
        working-directory: ${{ env.APP_DIR }}
        env:
          NODE_ENV: test
          TWENTY_API_URL: ${{ steps.twenty.outputs.server-url }}
          TWENTY_API_KEY: ${{ steps.twenty.outputs.api-key }}
          FRONT_BASE_URL: ${{ steps.twenty.outputs.server-url }}
        run: |
          set -o pipefail
          yarn screenshots 2>&1 | tee /tmp/screenshots.log

      # Same diagnostics channel as the live-test job: logs + Playwright's
      # failure screenshots pushed to a disposable branch, readable via API.
      - name: Publish failure diagnostics
        if: failure()
        working-directory: ${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/diag-repo/screenshots-${{ github.run_id }}
          cp /tmp/screenshots.log /tmp/diag-repo/screenshots-${{ github.run_id }}/ 2>/dev/null || true
          find e2e/.results -name '*.png' -exec cp {} /tmp/diag-repo/screenshots-${{ github.run_id }}/ \; 2>/dev/null || true
          docker logs twenty-app-dev-test > /tmp/diag-repo/screenshots-${{ github.run_id }}/server.log 2>&1 || true
          cd /tmp/diag-repo
          git init -q
          git config user.email "ci@github-actions"
          git config user.name "github-actions"
          git add . && git commit -qm "Screenshot diagnostics ${{ github.run_id }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:ci-diagnostics

      - name: Commit screenshots
        working-directory: ${{ env.APP_DIR }}
        run: |
          git config user.email "ci@github-actions"
          git config user.name "github-actions"
          git add public/screenshot-pipeline.png public/screenshot-estimate-to-job.png public/screenshot-jobs.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged, nothing to commit."
          else
            git commit -m "Capture real UI screenshots from live CI [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
